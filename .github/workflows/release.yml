name: Release Better Editor

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package Better Editor
        run: zip "better-editor-${GITHUB_REF_NAME}.zip" main.js manifest.json styles.css README.md LICENSE THIRD_PARTY_NOTICES.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "better-editor-${GITHUB_REF_NAME}.zip" main.js manifest.json styles.css --generate-notes --verify-tag
